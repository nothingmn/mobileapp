#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6g
kotlin.native.jvmArgs=-Xmx12g
ksp.useKSP2=true
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true
# atomicfu's bytecode transform task has no hook on AGP 9's KMP android target; the compiler
# plugin does the same job.
kotlinx.atomicfu.enableJvmIrTransformation=true

#Gradle
org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true

#Android
kotlin.incremental.native=true
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.mpp.enableCInteropCommonization=true

org.gradle.configuration-cache=true

bugUrl=
tokenUrl=
githubClientId=
githubClientSecret=
wisprAuthUrl=
kirinkiUrl=
googleClientId=
googleAuthEnabled=false
appleAuthEnabled=false
githubAuthEnabled=false

# Gravel: the Agentry voice loop (VOICE_MQTT_ENABLED). Off unless a build asks for it, so an upstream PR
# ships inert: no MQTT client is bound, no Settings entry appears and no connection is made.
voiceMqttEnabled=false

# Gravel: who the voice loop talks to. Every key is deliberately blank: no broker address, port or topic is
# baked into this repository, so nothing here belongs to one person's network. A builder supplies their own,
# either here or as -PvoiceMqttBrokerHost=... on the command line, and a phone built without them starts with
# the fields empty and asks the user to enter an address before the loop can be turned on.
voiceMqttBrokerHost=
voiceMqttBrokerPort=
# Blank means no: connect with plain tcp:// unless a value is supplied.
voiceMqttTls=
voiceMqttRequestTopic=
voiceMqttResponseTopic=
